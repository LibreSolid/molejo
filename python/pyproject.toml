[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molejo"
version = "0.2.0"
description = "Analytic flexible parts for mechanical CAD: parametric swept shapes evaluated identically in Python and the browser"
# `README.md`, `LICENSE` and `NOTICE` here are symlinks to the repository
# root's: one package directory of a two-package repository does not own
# its own copy of the project's front page or its licence. Both build
# backends dereference them, so the wheel and the sdist carry real files.
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Luis Henrique Cassis Fagundes", email = "lhfagundes@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
]
classifiers = [
    # No `License ::` classifier: the SPDX `license` expression above is the
    # licence declaration, and metadata 2.4 forbids stating it twice.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    # There is no CAD classifier in the trove list (PyPI rejects invented
    # ones at upload), so the closest honest pair stands in for it.
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]

# The B-rep evaluator is optional: the browser never needs OCCT and a maker
# who only wants meshes should not install a CAD kernel to get them. `molejo`
# and its STL export run on numpy alone; `molejo[brep]` adds exact shapes.
[project.optional-dependencies]
brep = [
    "cadquery-ocp",
]

[project.urls]
Homepage = "https://github.com/LibreSolid/molejo"
Documentation = "https://molejo.readthedocs.io"

[tool.setuptools.packages.find]
include = ["molejo", "molejo.*"]
