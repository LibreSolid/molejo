[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molejo"
version = "0.0.1.dev0"
description = "Analytic flexible parts for mechanical CAD: parametric swept shapes evaluated identically in Python and the browser"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
authors = [
    {name = "Luis Henrique Cassis Fagundes", email = "lhfagundes@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
]

[project.urls]
Homepage = "https://github.com/LibreSolid/molejo"

[tool.setuptools.packages.find]
include = ["molejo", "molejo.*"]
