# Read the Docs configuration for molejo.readthedocs.io.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    # The Python package itself, so autodoc documents the installed code.
    # The plain package (numpy only): molejo.brep imports without OCCT by
    # design, so the API reference never needs the `brep` extra.
    - method: pip
      path: python
